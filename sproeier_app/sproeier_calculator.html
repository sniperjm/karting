<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prisma Rotax Jet Calculator</title>

  <style>
    :root{
      --bg:#0f1115;
      --panel:#161a22;
      --text:#e8ecf1;
      --muted:#9aa4b2;
      --border:#252b36;
      --good:#2ecc71;
      --bad:#e74c3c;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial}
    header{padding:14px;border-bottom:1px solid var(--border)}
    h1{margin:0;font-size:18px}
    header p{margin:6px 0 0;color:var(--muted);font-size:13px}
    .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;margin:14px;padding:14px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .full{grid-column:1 / -1}
    label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
    input,select{
      width:100%;
      padding:12px;
      border-radius:12px;
      border:1px solid var(--border);
      background:#0c0f14;
      color:var(--text);
      font-size:16px;
    }
    .soft{color:var(--muted);font-size:12px;margin-top:8px}
    .row{display:flex;align-items:baseline;gap:10px}
    .result{font-size:44px;font-weight:800;margin:0;line-height:1}
    .tag{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      font-size:12px;
      border:1px solid var(--border);
      background:#0c0f14;
      color:var(--muted);
    }
    .rich{color:var(--good)}
    .lean{color:var(--bad)}
  </style>
</head>

<body>
  <header>
    <h1>Rotax Jet Calculator</h1>
    <p>Je vult alles zelf in. Jet volgt Prisma per motor op basis van Air Density.</p>
  </header>

  <section class="card">
    <div class="grid">
      <div class="full">
        <label>Rotax Engine</label>
        <select id="engine">
          <option value="dd2">Rotax DD2</option>
          <option value="junior">Rotax Junior</option>
          <option value="senior" selected>Rotax Senior</option>
          <option value="mini">Rotax Mini</option>
          <option value="micro">Rotax Micro</option>
        </select>
      </div>

      <div>
        <label>Temperatuur (°C)</label>
        <input id="temp" type="number" inputmode="decimal" placeholder="2.2">
      </div>

      <div>
        <label>Luchtdruk (hPa)</label>
        <input id="pressure" type="number" inputmode="decimal" placeholder="993.0">
      </div>

      <div>
        <label>Vochtigheid (%)</label>
        <input id="rh" type="number" inputmode="decimal" placeholder="85">
      </div>

      <div>
        <label>Hoogte (m)</label>
        <input id="alt" type="number" inputmode="decimal" placeholder="6">
      </div>

      <div class="full">
        <label>Air Density ρ (kg/m³)</label>
        <input id="rho" type="number" step="0.001" inputmode="decimal" placeholder="1.290">
        <div class="soft">Alleen ρ wordt gebruikt voor de jet. De velden hierboven zijn alleen voor jouw overzicht.</div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="soft">Aanbevolen sproeier</div>
    <div class="row">
      <div id="jet" class="result">—</div>
      <div id="pct" class="tag">—</div>
    </div>
  </section>

  <script>
    const RHO_STD = 1.225;
    const SLOPE = 1.32;

    const ENGINE_BASELINE = {
      senior: 133,
      dd2: 137,
      junior: 135,
      mini: 120,
      micro: 114
    };

    function readNumber(id){
      const raw = (document.getElementById(id).value || "").toString().trim();
      if (!raw) return null;
      const n = parseFloat(raw.replace(",", "."));
      return isFinite(n) ? n : null;
    }

    function clamp(v, lo, hi){
      return Math.max(lo, Math.min(hi, v));
    }

    function update(){
      const rho = readNumber("rho");
      const jetEl = document.getElementById("jet");
      const pctEl = document.getElementById("pct");

      if (rho === null){
        jetEl.textContent = "—";
        pctEl.textContent = "—";
        pctEl.className = "tag";
        return;
      }

      const pct = ((rho - RHO_STD) / RHO_STD) * 100;

      const engine = document.getElementById("engine").value;
      const baseline = ENGINE_BASELINE[engine] ?? ENGINE_BASELINE.senior;

      let jet = baseline + (pct * SLOPE);
      jet = Math.round(jet);
      jet = clamp(jet, 80, 200);

      jetEl.textContent = jet;

      const sign = pct > 0 ? "+" : "";
      pctEl.textContent = sign + pct.toFixed(1) + "%";
      pctEl.className = "tag " + (pct >= 0 ? "rich" : "lean");
    }

    ["engine","rho","temp","pressure","rh","alt"].forEach(id=>{
      document.getElementById(id).addEventListener("input", update);
    });

    update();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prisma Rotax Senior Jet Calculator</title>

  <style>
    :root{
      --bg:#0f1115;
      --panel:#161a22;
      --text:#e8ecf1;
      --muted:#9aa4b2;
      --border:#252b36;
      --good:#2ecc71;
      --bad:#e74c3c;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial}
    header{padding:14px;border-bottom:1px solid var(--border)}
    h1{margin:0;font-size:18px}
    header p{margin:6px 0 0;color:var(--muted);font-size:13px}
    .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;margin:14px;padding:14px}
    label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
    input{
      width:100%;
      padding:12px;
      border-radius:12px;
      border:1px solid var(--border);
      background:#0c0f14;
      color:var(--text);
      font-size:16px;
    }
    .soft{color:var(--muted);font-size:12px;margin-top:8px}
    .row{display:flex;align-items:baseline;gap:10px}
    .result{font-size:44px;font-weight:800;margin:0;line-height:1}
    .tag{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      font-size:12px;
      border:1px solid var(--border);
      background:#0c0f14;
      color:var(--muted);
    }
    .rich{color:var(--good)}
    .lean{color:var(--bad)}
  </style>
</head>

<body>
  <header>
    <h1>Rotax Senior Jet Calculator</h1>
    <p>Prisma stijl. Input is alleen Air Density. Geen berekening uit druk of temperatuur.</p>
  </header>

  <section class="card">
    <label>Air Density (kg/m³)</label>
    <input id="rho" type="number" step="0.001" inputmode="decimal" placeholder="Bijvoorbeeld 1.290">
    <div class="soft">Tip: vul hier de waarde in die je meter of Prisma site gebruikt.</div>
  </section>

  <section class="card">
    <div class="soft">Aanbevolen sproeier</div>
    <div class="row">
      <div id="jet" class="result">—</div>
      <div id="pct" class="tag">—</div>
    </div>
  </section>

  <script>
    const RHO_STD = 1.225;

    // Rotax Senior baseline zoals Prisma uitlegt met % t.o.v. 1.225 kg/m³. :contentReference[oaicite:0]{index=0}
    const BASELINE = 133;

    // Afgesteld op jouw Prisma voorbeeld: rho 1.290 geeft 140.
    // Dit geeft 140 bij 1.290 door dezelfde % schaal te gebruiken.
    const SLOPE_JET_PER_PCT = 1.32;

    function readNumber(id){
      const raw = (document.getElementById(id).value || "").toString().trim();
      if (!raw) return null;
      const n = parseFloat(raw.replace(",", "."));
      return isFinite(n) ? n : null;
    }

    function clamp(v, lo, hi){
      return Math.max(lo, Math.min(hi, v));
    }

    function update(){
      const rho = readNumber("rho");
      const jetEl = document.getElementById("jet");
      const pctEl = document.getElementById("pct");

      if (rho === null){
        jetEl.textContent = "—";
        pctEl.textContent = "—";
        pctEl.className = "tag";
        return;
      }

      const pct = ((rho - RHO_STD) / RHO_STD) * 100;
      let jet = BASELINE + (pct * SLOPE_JET_PER_PCT);
      jet = Math.round(jet);
      jet = clamp(jet, 115, 155);

      jetEl.textContent = jet;

      const sign = pct > 0 ? "+" : "";
      pctEl.textContent = sign + pct.toFixed(1) + "%";
      pctEl.className = "tag " + (pct >= 0 ? "rich" : "lean");
    }

    document.getElementById("rho").addEventListener("input", update);
    update();
  </script>
</body>
</html>

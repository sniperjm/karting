<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JanFred Prisma Sproeier Calculator</title>

  <style>
    :root {
      --bg:#0f1115;
      --panel:#161a22;
      --text:#e8ecf1;
      --muted:#9aa4b2;
      --accent:#ff2d55;
      --good:#2ecc71;
      --bad:#e74c3c;
      --border:#252b36;
    }

    * { box-sizing:border-box }

    body {
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
    }

    header {
      padding:14px;
      border-bottom:1px solid var(--border);
    }

    h1 {
      margin:0;
      font-size:22px;
    }

    header p {
      margin:4px 0 0;
      font-size:13px;
      color:var(--muted);
    }

    .card {
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:14px;
      margin:14px;
      padding:14px;
    }

    .grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .full {
      grid-column:1 / -1;
    }

    label {
      font-size:12px;
      color:var(--muted);
      display:block;
      margin-bottom:4px;
    }

    input {
      width:100%;
      padding:12px;
      border-radius:12px;
      border:1px solid var(--border);
      background:#0c0f14;
      color:var(--text);
      font-size:16px;
    }

    .result {
      font-size:44px;
      font-weight:800;
      margin:0;
    }

    .tag {
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      font-size:12px;
      border:1px solid var(--border);
      background:#0c0f14;
      margin-left:8px;
    }

    .rich { color:var(--good) }
    .lean { color:var(--bad) }

    .soft {
      font-size:12px;
      color:var(--muted);
    }

    .btn {
      margin-top:10px;
      width:100%;
      padding:12px;
      border:none;
      border-radius:12px;
      background:var(--accent);
      color:white;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>JanFred Prisma Sproeier Calculator</h1>
  <p>Rotax Max Senior EVO • Prisma calculator</p>
</header>

<section class="card">
  <div class="grid">
    <div>
      <label>Temperatuur °C</label>
      <input id="temp" type="number" value="20">
    </div>

    <div>
      <label>Luchtdruk hPa</label>
      <input id="pressure" type="number" value="1013.25">
    </div>

    <div>
      <label>Relatieve vochtigheid %</label>
      <input id="rh" type="number" value="50">
    </div>

    <div>
      <label>Luchtdichtheid ρ kg/m³</label>
      <input id="rho" type="number" step="0.001" placeholder="Leeg = automatisch">
    </div>
  </div>

  <button class="btn" id="calcRho">Bereken ρ uit T, P, rH</button>

  <div class="soft" style="margin-top:8px">
    Ingevulde ρ heeft altijd voorrang.
  </div>
</section>

<section class="card">
  <div class="soft">Aanbevolen sproeier</div>
  <div>
    <span id="jet" class="result">—</span>
    <span id="flag" class="tag">—</span>
  </div>
</section>

<script>
  const R_d = 287.058;
  const R_v = 461.495;

  const RHO_STD = 1.225;
  const BASELINE = 133;
  const SLOPE = 1.32;

  function es_hPa(Tc) {
    return 6.112 * Math.exp((17.62 * Tc) / (243.12 + Tc));
  }

  function computeDensity(Tc, P_hPa, RH) {
    const T = Tc + 273.15;
    const P = P_hPa * 100;
    const e = es_hPa(Tc) * (RH / 100);
    const ePa = e * 100;
    const Pd = P - ePa;
    return (Pd / (R_d * T)) + (ePa / (R_v * T));
  }

  function densityDeltaPct(rho) {
    return ((rho - RHO_STD) / RHO_STD) * 100;
  }

  function update() {
    const Tc = parseFloat(temp.value);
    const P  = parseFloat(pressure.value);
    const RH = parseFloat(rh.value);

    let rho;

    if (rhoInput.value !== "") {
      rho = parseFloat(rhoInput.value);
    } else {
      rho = computeDensity(Tc, P, RH);
    }

    if (!isFinite(rho)) {
      jet.textContent = "—";
      flag.textContent = "—";
      return;
    }

    const dPct = densityDeltaPct(rho);
    const jetValue = Math.round(BASELINE + dPct * SLOPE);

    jet.textContent = jetValue;
    flag.textContent = (dPct > 0 ? "+" : "") + dPct.toFixed(1) + "% ρ";
    flag.className = "tag " + (dPct > 0 ? "rich" : "lean");
  }

  const temp = document.getElementById("temp");
  const pressure = document.getElementById("pressure");
  const rh = document.getElementById("rh");
  const rhoInput = document.getElementById("rho");
  const jet = document.getElementById("jet");
  const flag = document.getElementById("flag");

  document.querySelectorAll("input").forEach(i =>
    i.addEventListener("input", update)
  );

  document.getElementById("calcRho").addEventListener("click", () => {
    const rho = computeDensity(
      parseFloat(temp.value),
      parseFloat(pressure.value),
      parseFloat(rh.value)
    );
    rhoInput.value = rho.toFixed(3);
    update();
  });

  update();
</script>

</body>
</html>
